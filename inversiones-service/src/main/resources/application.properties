# Server Configuration
server.port=8082
server.servlet.context-path=/

# Application Name
spring.application.name=inversiones-service

# Fondos Service Configuration
fondos-service.url=http://localhost:8081

# Database Configuration - MySQL
# Local development
spring.datasource.url=jdbc:mysql://localhost:3306/inversiones_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For testing with H2 (uncomment to use)
# spring.datasource.url=jdbc:h2:mem:inversionesdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.bancocloud.inversiones_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Jackson Configuration
spring.jackson.serialization.indent-output=true
