# Server Configuration
server.port=8090
server.servlet.context-path=/

# Application Name
spring.application.name=bff-service

# ===========================
# AWS Cognito
# ===========================
# Issuer and App Client of the Cognito User Pool (required, no defaults)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}
# Optional: the User Pool JWKS as JSON (public keys). When set, tokens are verified
# without reaching Cognito, for hosts without internet access (private EC2 without NAT)
app.cognito.jwks=${COGNITO_JWKS:}

# ===========================
# Microservices URLs
# ===========================
microservices.fondos.url=${FONDOS_SERVICE_URL:http://localhost:8081}
microservices.inversiones.url=${INVERSIONES_SERVICE_URL:http://localhost:8082}
microservices.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8083}
microservices.rabbit-admin.url=${RABBIT_ADMIN_SERVICE_URL:http://localhost:8085}
microservices.notificaciones.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8084}

# ===========================
# HTTP Client Configuration
# ===========================
http.client.connect-timeout=5000
http.client.read-timeout=10000
http.client.write-timeout=10000

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.bancocloud.bff_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# ===========================
# CORS Configuration
# ===========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}