version: '3.8'

services:
  # ============ Usuarios Service ============
  usuarios-service:
    build:
      context: ./usuarios-service
      dockerfile: Dockerfile
    container_name: bancocloud-usuarios-service
    environment:
      # AWS RDS Configuration - Separate URL for usuarios_db
      DB_URL: ${USUARIOS_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_USUARIOS_SERVICE: DEBUG
    expose:
      - "8083"
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Fondos Service ============
  fondos-service:
    build:
      context: ./fondos-service
      dockerfile: Dockerfile
    container_name: bancocloud-fondos-service
    environment:
      # AWS RDS Configuration - Separate URL for fondos_db
      DB_URL: ${FONDOS_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_FONDOS_SERVICE: DEBUG
    expose:
      - "8081"
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Inversiones Service ============
  inversiones-service:
    build:
      context: ./inversiones-service
      dockerfile: Dockerfile
    container_name: bancocloud-inversiones-service
    environment:
      # AWS RDS Configuration - Separate URL for inversiones_db
      DB_URL: ${INVERSIONES_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Fondos Service URL (use Docker service name in Docker, localhost for local dev)
      FONDOS_SERVICE_URL: ${FONDOS_SERVICE_URL}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_INVERSIONES_SERVICE: DEBUG
    expose:
      - "8082"
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ BFF Service (API Gateway) ============
  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bancocloud-bff-service
    environment:
      # AWS Cognito Configuration
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      # Microservices URLs (use Docker service names)
      FONDOS_SERVICE_URL: ${FONDOS_SERVICE_URL}
      INVERSIONES_SERVICE_URL: ${INVERSIONES_SERVICE_URL}
      USUARIOS_SERVICE_URL: ${USUARIOS_SERVICE_URL}
      # CORS Configuration
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_BFF_SERVICE: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    ports:
      - "8090:8090"
    depends_on:
      fondos-service:
        condition: service_healthy
      inversiones-service:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Frontend (React + Nginx) ============
  frontend:
    build:
      context: ../Cloud-Native-Front-end-main
      dockerfile: Dockerfile
      args:
        # Pass VITE variables as build-time arguments
        VITE_API_URL: ${VITE_API_URL}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID}
        VITE_AWS_REGION: ${VITE_AWS_REGION}
    container_name: bancocloud-frontend
    ports:
      - "80:80"
    depends_on:
      - bff-service
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 20s
    restart: unless-stopped

# ============ Networks ============
networks:
  bancocloud-network:
    driver: bridge
