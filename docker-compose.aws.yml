# Ajustes para la EC2 (se usa junto con docker-compose.yml desde deploy/ec2-deploy.sh).
#
# - Imágenes con nombre fijo: las carga el paquete de deploy/build-bundle.sh o las
#   construye "docker compose build" si el servidor tiene internet.
# - Healthchecks con bash (/dev/tcp): las imágenes del paquete no traen curl.
# - JVM acotada: los 8 servicios Java usan ~1,5-2 GB con esta configuración. Con el clúster
#   RabbitMQ (3 nodos), Zookeeper, 3 brokers Kafka y Kafka-UI el total ronda 5 GB: la EC2
#   necesita 8 GB (t3.large).

x-jvm: &jvm
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseSerialGC -Xss512k -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m}
  # Limita los arenas de malloc de glibc, que inflan la memoria de la JVM en contenedores
  MALLOC_ARENA_MAX: "2"

x-health: &health
  timeout: 10s
  retries: 5
  interval: 15s
  # Las 8 JVM arrancan a la vez en la t3.large: un servicio llegó a tardar 132 s en el primer
  # despliegue de la EP5. Durante start_period los fallos no cuentan.
  start_period: 180s

services:
  usuarios-service:
    image: bancocloud/usuarios-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  fondos-service:
    image: bancocloud/fondos-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  inversiones-service:
    image: bancocloud/inversiones-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  notificaciones-service:
    image: bancocloud/notificaciones-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  rabbit-admin-service:
    image: bancocloud/rabbit-admin-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  analitica-service:
    image: bancocloud/analitica-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  kafka-admin-service:
    image: bancocloud/kafka-admin-service:ep5
    environment: *jvm
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

  bff-service:
    image: bancocloud/bff-service:ep5
    environment:
      <<: *jvm
      # Spring Security en DEBUG genera mucho log por petición; en la EC2 basta INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
