server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: fondos-service

  # Database Configuration - AWS RDS (required environment variables, no defaults)
  datasource:
    url: ${FONDOS_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  jackson:
    serialization:
      indent-output: true

  web:
    error:
      include-message: always
      include-binding-errors: always

  # RabbitMQ connection - all values come from environment variables
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Fail fast if the broker is unreachable so HTTP requests are not held up
    connection-timeout: 5s
    # Publisher confirms/returns: RabbitMQConfig logs unconfirmed or unroutable messages
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # Kafka (EP5): streaming de eventos para analítica. RabbitMQ sigue a cargo de los avisos.
  # Este servicio solo produce; el consumidor está en analitica-service.
  kafka:
    # Los 3 brokers: si uno cae, el cliente sigue descubriendo el clúster por los otros dos.
    # En Docker: kafka-1:29092,kafka-2:29092,kafka-3:29092 (ver .env.example)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializer JSON vigente de Spring Kafka 4 (Jackson 3); JsonSerializer está deprecado
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # all + min.insync.replicas=2: un cambio de valor cuota se confirma solo cuando 2 de 3
      # réplicas lo tienen
      acks: all
      retries: 3
      properties:
        # Sin duplicados por reintentos y sin desorden dentro de la partición (por fondoId)
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Agrupa mensajes 5 ms para mandar lotes; lz4 comprime con poco CPU
        linger.ms: 5
        compression.type: lz4
        # Si Kafka no responde, send() no debe retener la respuesta HTTP más de 5 s
        # (el valor por defecto es 60 s). Igual que connection-timeout de RabbitMQ.
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        # El consumidor conoce el tipo por configuración; no se mandan clases Java en headers
        spring.json.add.type.headers: false

# Messaging names for the fondos domain (read through RabbitMQProperties).
# DLQ names are derived as <queue>.dlq.
app:
  rabbitmq:
    dlx: bancocloud.dlx
    exchanges:
      fondos: bancocloud.fondos
    queues:
      valorcuota: fondos.valorcuota.q
    routing-keys:
      valorcuota-actualizado: fondo.valorcuota.actualizado

  # Tópicos de Kafka que este servicio declara (dueño del tópico). Leídos por BancoKafkaProperties.
  kafka:
    topics:
      valor-cuota:
        name: bancocloud.fondos.valorcuota
        # 3 particiones = hasta 3 consumidores en paralelo por grupo. Key = fondoId, así cada
        # fondo queda siempre en la misma partición y sus cambios se leen en orden.
        partitions: 3
        # 3 réplicas (una por broker) y min.insync 2: tolera la caída de un broker sin perder
        # ni dejar de aceptar escrituras con acks=all.
        replicas: 3
        min-insync-replicas: 2
        # compact: Kafka conserva siempre el último valor cuota de cada fondo (por key), así un
        # consumidor nuevo conoce el valor vigente de todos los fondos. delete: además borra lo
        # que pasa de 30 días, para que la serie histórica reciente quede y el tópico no crezca
        # sin límite.
        cleanup-policy: compact,delete
        retention-ms: 2592000000
    dlt:
      # Tópico de errores: <tópico>.DLT, mismas particiones (el mensaje vuelve a la misma
      # partición) y réplicas. 14 días para revisar y reprocesar los mensajes fallidos.
      suffix: .DLT
      retention-ms: 1209600000

management:
  health:
    # RabbitMQ is optional for this service: business operations keep working without it
    rabbit:
      enabled: false

logging:
  level:
    root: INFO
    com.bancocloud.fondos_service: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
