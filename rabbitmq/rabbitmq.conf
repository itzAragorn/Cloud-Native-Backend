# Banco Cloud - configuración común de los 3 nodos del clúster RabbitMQ (docker-compose.rabbitmq.yml)

# Formación del clúster con lista fija de nodos: cada nodo, al arrancar por primera vez, se une a
# los que ya estén arriba. Los nombres son rabbit@<hostname> de cada contenedor.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Si un nodo queda aislado de la mayoría, se pausa en vez de seguir aceptando mensajes por su cuenta
# (evita dos "mitades" del clúster con datos distintos).
cluster_partition_handling = pause_minority

# Memoria acotada por nodo: los 3 corren en la misma máquina y cada uno cree que tiene toda la RAM.
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 256MiB
