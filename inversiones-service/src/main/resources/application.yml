server:
  port: 8082
  servlet:
    context-path: /

# Fondos Service Configuration - Parametrized for Docker and local development
FONDOS_SERVICE_URL: http://localhost:8081

spring:
  application:
    name: inversiones-service

  # Database Configuration - AWS RDS (required environment variables, no defaults)
  datasource:
    url: ${INVERSIONES_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  jackson:
    serialization:
      indent-output: true

  # RabbitMQ connection - all values come from environment variables
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Fail fast if the broker is unreachable so HTTP requests are not held up
    connection-timeout: 5s
    # Publisher confirms/returns: RabbitMQConfig logs unconfirmed or unroutable messages
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Messaging names for the inversiones domain (read through RabbitMQProperties).
# DLQ names are derived as <queue>.dlq.
app:
  rabbitmq:
    dlx: bancocloud.dlx
    exchanges:
      inversiones: bancocloud.inversiones
    queues:
      comprobante: inversiones.comprobante.q
    routing-keys:
      inversion-creada: inversion.creada

management:
  health:
    # RabbitMQ is optional for this service: business operations keep working without it
    rabbit:
      enabled: false

logging:
  level:
    root: INFO
    com.bancocloud.inversiones_service: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
