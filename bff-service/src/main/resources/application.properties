# Server Configuration
server.port=8090
server.servlet.context-path=/

# Application Name
spring.application.name=bff-service

# ===========================
# JWT Configuration for AWS
# ===========================
# Clave secreta para firmar/validar JWT (cambiar en producción)
jwt.secret=BancoCloud-Super-Secret-Key-Change-In-Production
jwt.expiration=86400000
jwt.issuer=bancoclod
jwt.audience=bancoclod-app

# ===========================
# Microservices URLs
# ===========================
microservices.fondos.url=http://localhost:8081
microservices.inversiones.url=http://localhost:8082
microservices.usuarios.url=http://localhost:8083

# ===========================
# HTTP Client Configuration
# ===========================
http.client.connect-timeout=5000
http.client.read-timeout=10000
http.client.write-timeout=10000

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.bancocloud.bff_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# ===========================
# CORS Configuration
# ===========================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,https://yourdomain.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.max-age=3600
