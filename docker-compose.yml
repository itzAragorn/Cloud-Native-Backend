# Banco Cloud - backend services, BFF and frontend.
# The brokers live in their own files and are started together with this one (see README):
#   docker compose -f docker-compose.rabbitmq.yml -f docker-compose.kafka.yml \
#     -f docker-compose.kafka-ui.yml -f docker-compose.yml up -d --build
# All configuration comes from .env (see .env.example). Internal service URLs
# use Docker service names and are fixed here.

x-rabbitmq-env: &rabbitmq-env
  # The 3 nodes of docker-compose.rabbitmq.yml; addresses takes precedence over host/port
  SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-rabbitmq-1:5672,rabbitmq-2:5672,rabbitmq-3:5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?define RABBITMQ_USERNAME in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?define RABBITMQ_PASSWORD in .env}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

x-kafka-env: &kafka-env
  # The 3 brokers of docker-compose.kafka.yml (internal listener)
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:29092,kafka-2:29092,kafka-3:29092}

# Brokers are defined in docker-compose.rabbitmq.yml and docker-compose.kafka.yml: this file is
# always started together with them (a single Compose project).
x-depends-rabbitmq: &depends-rabbitmq
  rabbitmq-1:
    condition: service_healthy

x-depends-kafka: &depends-kafka
  # Topics have 3 replicas: they can only be created once the 3 brokers are up
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

services:
  # ============ Usuarios Service ============
  usuarios-service:
    build:
      context: ./usuarios-service
      dockerfile: Dockerfile
    container_name: bancocloud-usuarios-service
    environment:
      <<: *rabbitmq-env
      # AWS RDS Configuration - Separate URL for usuarios_db
      USUARIOS_DB_URL: ${USUARIOS_DB_URL:?define USUARIOS_DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?define DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in .env}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_USUARIOS_SERVICE: DEBUG
    expose:
      - "8083"
    depends_on:
      <<: *depends-rabbitmq
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Fondos Service ============
  fondos-service:
    build:
      context: ./fondos-service
      dockerfile: Dockerfile
    container_name: bancocloud-fondos-service
    environment:
      <<: [*rabbitmq-env, *kafka-env]
      # AWS RDS Configuration - Separate URL for fondos_db
      FONDOS_DB_URL: ${FONDOS_DB_URL:?define FONDOS_DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?define DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in .env}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_FONDOS_SERVICE: DEBUG
    expose:
      - "8081"
    depends_on:
      <<: [*depends-rabbitmq, *depends-kafka]
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Inversiones Service ============
  inversiones-service:
    build:
      context: ./inversiones-service
      dockerfile: Dockerfile
    container_name: bancocloud-inversiones-service
    environment:
      <<: [*rabbitmq-env, *kafka-env]
      # AWS RDS Configuration - Separate URL for inversiones_db
      INVERSIONES_DB_URL: ${INVERSIONES_DB_URL:?define INVERSIONES_DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?define DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in .env}
      FONDOS_SERVICE_URL: http://fondos-service:8081
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_INVERSIONES_SERVICE: DEBUG
    expose:
      - "8082"
    depends_on:
      <<: [*depends-rabbitmq, *depends-kafka]
      fondos-service:
        condition: service_healthy
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Notificaciones Service (RabbitMQ consumers + Kafka auditoría) ============
  notificaciones-service:
    build:
      context: ./notificaciones-service
      dockerfile: Dockerfile
    container_name: bancocloud-notificaciones-service
    environment:
      <<: [*rabbitmq-env, *kafka-env]
      COMPROBANTES_DIR: /app/data/comprobantes
      LOGGING_LEVEL_COM_BANCOCLOUD_NOTIFICACIONES_SERVICE: DEBUG
    expose:
      - "8084"
    volumes:
      - comprobantes-data:/app/data/comprobantes
    depends_on:
      <<: [*depends-rabbitmq, *depends-kafka]
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ RabbitMQ Admin Service ============
  rabbit-admin-service:
    build:
      context: ./rabbit-admin-service
      dockerfile: Dockerfile
    container_name: bancocloud-rabbit-admin-service
    environment:
      <<: *rabbitmq-env
      LOGGING_LEVEL_COM_BANCOCLOUD_RABBIT_ADMIN_SERVICE: DEBUG
    expose:
      - "8085"
    depends_on:
      <<: *depends-rabbitmq
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Analítica Service (Kafka consumers) ============
  analitica-service:
    build:
      context: ./analitica-service
      dockerfile: Dockerfile
    container_name: bancocloud-analitica-service
    environment:
      <<: *kafka-env
      # AWS RDS Configuration - Separate URL for analitica_db
      ANALITICA_DB_URL: ${ANALITICA_DB_URL:?define ANALITICA_DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?define DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in .env}
      LOGGING_LEVEL_COM_BANCOCLOUD_ANALITICA_SERVICE: DEBUG
    expose:
      - "8086"
    depends_on:
      <<: *depends-kafka
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Kafka Admin Service ============
  kafka-admin-service:
    build:
      context: ./kafka-admin-service
      dockerfile: Dockerfile
    container_name: bancocloud-kafka-admin-service
    environment:
      <<: *kafka-env
      LOGGING_LEVEL_COM_BANCOCLOUD_KAFKA_ADMIN_SERVICE: DEBUG
    expose:
      - "8087"
    depends_on:
      <<: *depends-kafka
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ BFF Service (API Gateway) ============
  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bancocloud-bff-service
    environment:
      # AWS Cognito Configuration
      COGNITO_ISSUER: ${COGNITO_ISSUER:?define COGNITO_ISSUER in .env}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?define COGNITO_CLIENT_ID in .env}
      # Optional: User Pool JWKS for hosts without internet access (see .env.example)
      COGNITO_JWKS: ${COGNITO_JWKS:-}
      # Microservices URLs (Docker service names)
      FONDOS_SERVICE_URL: http://fondos-service:8081
      INVERSIONES_SERVICE_URL: http://inversiones-service:8082
      USUARIOS_SERVICE_URL: http://usuarios-service:8083
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin-service:8085
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8084
      ANALITICA_SERVICE_URL: http://analitica-service:8086
      KAFKA_ADMIN_SERVICE_URL: http://kafka-admin-service:8087
      # CORS Configuration
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      # Logging
      LOGGING_LEVEL_COM_BANCOCLOUD_BFF_SERVICE: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    ports:
      - "8090:8090"
    depends_on:
      fondos-service:
        condition: service_healthy
      inversiones-service:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
      rabbit-admin-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      analitica-service:
        condition: service_healthy
      kafka-admin-service:
        condition: service_healthy
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped

  # ============ Frontend (React + Nginx) ============
  frontend:
    build:
      context: ../Cloud-Native-Front-end-main
      dockerfile: Dockerfile
      args:
        # Pass VITE variables as build-time arguments
        VITE_API_URL: ${VITE_API_URL}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID}
        VITE_AWS_REGION: ${VITE_AWS_REGION}
    container_name: bancocloud-frontend
    ports:
      - "80:80"
    depends_on:
      - bff-service
    networks:
      - bancocloud-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 20s
    restart: unless-stopped

# ============ Networks ============
networks:
  bancocloud-network:
    driver: bridge

# ============ Volumes ============
volumes:
  comprobantes-data:
