# Server Configuration
server.port=8090
server.servlet.context-path=/

# Application Name
spring.application.name=bff-service

# ===========================
# AWS Cognito
# ===========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_3rNV181z7}

# ===========================
# Microservices URLs
# ===========================
microservices.fondos.url=${FONDOS_SERVICE_URL:http://localhost:8081}
microservices.inversiones.url=${INVERSIONES_SERVICE_URL:http://localhost:8082}
microservices.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8083}

# ===========================
# HTTP Client Configuration
# ===========================
http.client.connect-timeout=5000
http.client.read-timeout=10000
http.client.write-timeout=10000

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.bancocloud.bff_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# ===========================
# CORS Configuration
# ===========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}